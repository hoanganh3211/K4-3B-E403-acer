services:
  api:
    build: .
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      SESSION_DB_PATH: /app/data/sessions.sqlite3
    volumes:
      - scriptscout_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  ui:
    build: .
    command: streamlit run app_ui.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      SCRIPTSCOUT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    profiles: [vector]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
volumes:
  scriptscout_data:
  qdrant_storage:
